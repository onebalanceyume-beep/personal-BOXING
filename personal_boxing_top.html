<!DOCTYPE html>

<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;font-family:'M PLUS Rounded 1c',sans-serif;
    word-break:keep-all;overflow-wrap:break-word;touch-action:manipulation;

  .logo-bar{
    text-align:center;padding:28px 20px 10px;

  .logo-bar img{height:52px;margin:0 auto 10px;border-radius:8px;}
  .logo-bar p{
    font-family:'Noto Serif JP',serif;font-size:14px;letter-spacing:.1em;color:#222;margin:0;
  }
  .choice-wrap{
    display:flex;flex-direction:column;min-height:calc(100vh - 110px);
  }
  @media (min-width:768px){
    .choice-wrap{flex-direction:row;}

  .choice{

  .choice.women{background:#f1c1c5;color:#3f2f1f;}

  .choice.men .en{color:#c9a227;}
  .choice h2{
    font-family:'Noto Serif JP',serif;font-size:26px;margin:0 0 14px;line-height:1.5;
  }
  .choice.women h2{font-family:'M PLUS Rounded 1c',sans-serif;}
  .choice p{font-size:14px;line-height:1.9;max-width:320px;margin:0 0 28px;}
  .choice .btn{
    display:inline-block;padding:14px 34px;border-radius:26px;font-weight:700;font-size:14px;
  }
  .choice.men .btn{background:#C8102E;color:#fff;}
  .choice.women .btn{background:#3f2f1f;color:#fff;}

<body>

<div class="logo-bar">

    <span class="btn">ボクシングページへ</span>
  </a>
  <a class="choice women" href="personal_boxing_women.html">
    <p class="en">WOMEN'S PERSONAL</p>

    <p>なりたい自分に、いちばん近いエクササイズ。<br>きれいなフォームと引き締まったスタイルへ。</p>
    <span class="btn">キックボクササイズページへ</span>
